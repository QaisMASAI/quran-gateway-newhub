name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test-type-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Vitest
        run: bunx vitest run

      - name: Run ESLint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Typecheck Vite config
        run: bun run typecheck:vite

      - name: Security audit (high/critical)
        run: bun audit --audit-level=high

      - name: Build
        run: bun run build
